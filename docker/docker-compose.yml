version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: predictive_lb
    ports:
      - "5432:5432"
    volumes:
      - ../database/migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: backend
    env_file:
      - ../backend/.env.example
    ports:
      - "4000:4000"
      - "4001:4001"
    depends_on:
      - db
    volumes:
      - ../backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
    env_file:
      - ../frontend/.env.example
    depends_on:
      - backend

  ml-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: ml-service
    env_file:
      - ../ml-service/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../ml-service:/app
    depends_on:
      - backend

volumes:
  pgdata:
